<!DOCTYPE html>
<html>
<head><title>Protco</title></head>
<body style="font-family: Arial; text-align: center; padding: 20px; background: #f5f5f5;">
    <h1> Protco</h1>
    <h2>Real Django + YOLO + Weather + Camera</h2>
    
    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <div style="background: #e0f2ff; padding: 20px; border-radius: 10px; min-width: 300px;">
            <h3>Live Weather </h3>
            <p>Temp: {{ weather.temp }}°C</p>
            <p>Condition: {{ weather.desc }}</p>
            <p>Humidity: {{ weather.humidity }}% | Wind: {{ weather.wind }} km/h</p>
            <p><b>{{ yolo_status }}</b></p>
        </div>
        
        <div style="background: white; padding: 20px; border-radius: 10px; min-width: 400px;">
            <h3>Live Camera Detection</h3>
            <video id="video" width="400" height="300" autoplay style="border: 2px solid black;"></video>
            <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>
            <p id="result" style="font-weight: bold; color: red; margin-top: 10px;">Waiting for detection...</p>
            <button onclick="startCam()" style="padding: 10px 20px; margin-top: 10px;">Start Camera</button>
        </div>
    </div>

    <script>
    function startCam() {
        navigator.mediaDevices.getUserMedia({video: true})
        .then(stream => {
            document.getElementById('video').srcObject = stream;
            document.getElementById('result').innerText = "✅ Camera ON - YOLO will detect damages (cracks, water damage, etc.)";
        })
        .catch(err => {
            document.getElementById('result').innerText = "❌ Camera error: " + err;
        });
    }
    </script>

    <p style="margin-top: 30px;">✅ Django Running on Laptop!</p>
</body>
</html>
